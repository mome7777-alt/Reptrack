;text-align:left;width:100%;padding:12px;border-radius:17px;background:var(--surface);border:1px solid var(--line);color:var(--text)}.thumb{width:52px;height:52px;border-radius:14px;background-size:cover;background-position:center;display:grid;place-items:center;font-size:23px;flex:none}.exercise-list b,.exercise-list small,.history-row b,.history-row small{display:block}.exercise-list small,.history-row small{color:var(--muted);margin-top:4px}.pill{font-size:11px;color:var(--lime);background:rgba(183,243,75,.1);padding:6px 8px;border-radius:99px}.settings-list{display:flex;flex-direction:column;gap:9px}.settings-list button,.settings-row{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:17px;padding:15px}.settings-list button span,.settings-row span{display:block}.settings-list small,.settings-row small{display:block;color:var(--muted);margin-top:4px}.empty{text-align:center;padding:35px 18px;color:var(--muted)}.empty .icon{display:block;font-size:39px;margin-bottom:12px}.form-grid{display:grid;gap:13px}.form-grid label{display:grid;gap:7px;color:var(--muted);font-size:12px;font-weight:700}.form-grid input,.form-grid select,.form-grid textarea{width:100%;background:#0f1317;border:1px solid var(--line);color:var(--text);border-radius:13px;padding:13px;outline:none}.form-grid input:focus,.form-grid select:focus,.form-grid textarea:focus{border-color:var(--lime)}.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}.modal{width:min(100%,620px);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:20px;animation:slide .23s ease}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modal-head h2{margin:0}.modal-head button{border:0;background:var(--surface-2);color:var(--text);width:35px;height:35px;border-radius:11px}.modal-actions{display:flex;gap:9px;margin-top:18px}.modal-actions button{flex:1}.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,18px);background:#eef6e2;color:#17200d;padding:11px 15px;border-radius:13px;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:80;white-space:nowrap;box-shadow:0 12px 35px rgba(0,0,0,.35)}.toast.show{opacity:1;transform:translate(-50%,0)}.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,760px);height:78px;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(17,21,25,.93);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:30}.bottom-nav button{border:0;background:none;color:#7f8b96;font-size:10px;font-weight:700;border-radius:13px}.bottom-nav button span{display:block;font-size:21px;line-height:22px;margin-bottom:4px}.bottom-nav button.active{color:var(--lime);background:rgba(183,243,75,.07)}.notice{font-size:12px;line-height:1.5;color:var(--muted);padding:13px;border:1px solid var(--line);border-radius:14px;background:#101419}.full{width:100%}.mt{margin-top:13px}.pr-strip{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 2px}.pr-badge{display:inline-flex;align-items:center;gap:5px;padding:7px 9px;border-radius:10px;font-size:11px;font-weight:900}.pr-badge.weight{background:rgba(183,243,75,.10);border:1px solid rgba(183,243,75,.28);color:var(--lime)}.pr-badge.rep{background:rgba(108,200,255,.10);border:1px solid rgba(108,200,255,.28);color:var(--blue)}.pr-badge.e1rm{background:rgba(255,156,85,.10);border:1px solid rgba(255,156,85,.28);color:var(--orange)}.pr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.pr-card{padding:13px 10px;background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:16px}.pr-card b{display:block;font-size:20px}.pr-card span{display:block;color:var( <body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-nav="home" aria-label="Početna">
        <span class="brand-mark">R</span>
        <span><strong>RepTrack V3</strong><small>PR sistem · lokalni podaci</small></span>
      </button>
      <button id="installBtn" class="ghost compact" hidden>Instaliraj</button>
    </header>

    <main id="app" tabindex="-1" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Glavna navigacija">
      <button data-nav="home" class="active"><span>⌂</span>Početna</button>
      <button data-nav="workout"><span>＋</span>Trening</button>
      <button data-nav="progress"><span>↗</span>Progres</button>
      <button data-nav="more"><span>•••</span>Više</button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <div id="restTimer" class="rest-dock hidden" aria-live="polite"></div>
  <div id="modalRoot"></div>
  <script>
(() => {
  'use strict';

  const STORAGE_KEY = 'reptrack-data-v1';
  const app = document.getElementById('app');
  const toastEl = document.getElementById('toast');
  const modalRoot = document.getElementById('modalRoot');
  const palette = { Chest:'#aa69ff', Back:'#4fb8ff', Shoulders:'#ff9c55', Arms:'#ff6f91', Legs:'#62d28d', Core:'#ffd45c', Other:'#9aa9b8' };
  const muscleSr = { Chest:'Grudi', Back:'Leđa', Shoulders:'Ramena', Arms:'Ruke', Legs:'Noge', Core:'Core', Other:'Ostalo' };

  // Full Body A/B/C — unapred definisane vežbe i preporučene serije/ponavljanja.
  const programExercises = [
    ['goblet','Goblet čučanj','Legs','🦵',3,'10–12','90–120 s','Drži bučicu uz grudi, spuštaj kukove između kolena i zadrži celo stopalo na podu.','Kolena prate pravac prstiju; ne zaokružuj leđa.'],
    ['dbbench','Ravni potisak bučicama','Chest','🏋️',3,'8–12','90–120 s','Lezi na ravnu klupu, spuštaj bučice kontrolisano do nivoa grudi i potisni nagore.','Lopatice blago povuci unazad; ne zaključavaj laktove.'],
    ['onerow','Jednoručno veslanje bučicom','Back','🚣',3,'10–12 po ruci','90 s','Osloni se jednom rukom na klupu, povuci bučicu ka kuku i polako spusti.','Trup miran, bez rotiranja i trzaja.'],
    ['rdl','Rumunsko mrtvo dizanje','Legs','⚙️',2,'10–12','90–120 s','Guraj kukove unazad uz blago savijena kolena i spuštaj bučice uz noge.','Leđa neutralna; pokret vodi iz kukova.'],
    ['lateral','Odručenje bučicama','Shoulders','🪽',2,'12–15','45–60 s','Podigni bučice u stranu do približno visine ramena, pa kontrolisano spusti.','Laktovi blago savijeni; bez zamaha.'],
    ['cablecurl','Biceps pregib na donjoj sajli','Arms','💪',2,'12–15','45–60 s','Stani licem ka sajli i savij laktove bez pomeranja nadlaktica.','Ne ljuljaj trup; zadrži kontrolu i pri spuštanju.'],
    ['cablepush','Triceps potisak na gornjoj sajli','Arms','🔻',2,'12–15','45–60 s','Laktove drži uz telo i potisni ručku nadole do opružanja ruku.','Ne pomeraj ramena i ne širi laktove.'],
    ['calf','Podizanje na prste sa bučicama','Legs','⬆️',2,'15–20','45–60 s','Podigni pete što više, kratko zadrži i polako se spusti.','Koristi pun opseg pokreta; bez poskakivanja.'],
    ['plank','Plank','Core','▰',2,'30–45 sekundi','45–60 s','Osloni se na podlaktice i prste stopala, držeći telo u pravoj liniji.','Zategni stomak i gluteus; ne propadaj u donjim leđima.'],

    ['bulgarian','Bugarski iskorak','Legs','🦵',3,'8–10 po nozi','90–120 s','Zadnje stopalo postavi na klupu, spuštaj zadnje koleno ka podu i podigni se.','Prednje stopalo stabilno; po potrebi koristi oslonac.'],
    ['inclinepress','Kosi potisak bučicama','Chest','💪',3,'10–12','90–120 s','Podesi klupu na blag nagib i potiskuj bučice iznad gornjeg dela grudi.','Ne preteruj sa nagibom; zglobovi šaka iznad laktova.'],
    ['cable-row','Veslanje na donjoj sajli','Back','🚣',3,'10–12','90 s','Povuci ručku ka donjem delu stomaka, pa ispruži ruke uz kontrolu.','Ne zabacuj trup; lopatice povuci unazad.'],
    ['hipthrust','Hip thrust sa bučicom','Legs','🍑',2,'12–15','60–90 s','Nasloni gornji deo leđa na klupu, bučicu postavi preko kukova i podigni karlicu.','Na vrhu zategni gluteus, ne izvijaj donja leđa.'],
    ['reversefly','Obrnuto letenje na kosoj klupi','Shoulders','🪽',2,'12–15','45–60 s','Lezi grudima na kosu klupu i raširi bučice u stranu.','Pokret je iz ramena; koristi male težine.'],
    ['hammer','Hammer pregib bučicama','Arms','💪',2,'10–12','45–60 s','Drži dlanove okrenute jedan ka drugom i savij laktove.','Nadlaktice mirne; bez zamaha.'],
    ['overheadtri','Triceps opružanje iznad glave','Arms','🔺',2,'10–12','45–60 s','Drži jednu bučicu iznad glave i savij laktove spuštajući je iza glave.','Laktovi usmereni napred; stomak zategnut.'],
    ['deadbug','Dead bug','Core','🐞',2,'10–12 po strani','45–60 s','Lezi na leđa, spuštaj suprotnu ruku i nogu uz stabilan donji deo leđa.','Donja leđa ostaju blago priljubljena uz pod.'],

    ['sumo','Sumo čučanj sa bučicom','Legs','🦵',3,'10–12','90–120 s','Zauzmi širi stav sa prstima blago ka spolja i spuštaj bučicu između nogu.','Kolena prate prste; trup stabilan.'],
    ['chestrow','Veslanje bučicama na kosoj klupi','Back','🚣',3,'10–12','90 s','Lezi grudima na kosu klupu i povuci obe bučice ka kukovima.','Ne podiži grudi sa klupe; bez trzaja.'],
    ['dbshoulder','Sedeći potisak bučicama za ramena','Shoulders','⬆️',2,'10–12','90 s','Sedi uspravno i potiskuj bučice iz visine ramena iznad glave.','Ne izvijaj leđa; zategni stomak.'],
    ['altcurl','Naizmenični biceps pregib','Arms','💪',2,'10–12 po ruci','45–60 s','Naizmenično savijaj jednu pa drugu ruku, uz dlan koji se okreće nagore.','Laktovi uz telo i kontrolisano spuštanje.'],
    ['cabletri','Triceps opružanje na sajli','Arms','🔻',2,'12–15','45–60 s','Na sajli opružaj laktove nadole, bez pomeranja nadlaktica.','Zadrži kratko opružanje i vrati polako.'],
    ['reversecrunch','Obrnuti trbušnjak','Core','〰️',2,'12–15','45–60 s','Lezi na leđa i podigni karlicu ka grudima kontrolisanim pokretom.','Ne zamahuj nogama; pokret je mali i kontrolisan.']
  ].map(([id,name,muscle,emoji,sets,reps,rest,how,tips]) => ({id,name,muscle,emoji,sets,reps,rest,how,tips,custom:false}));

  const baseExercises = [...programExercises];

  function loadState(){
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if(parsed?.version === 1 && Array.isArray(parsed.exercises) && Array.isArray(parsed.workouts)){
        // Dodaj novi Full Body katalog i planove i postojećim korisnicima, bez brisanja istorije.
        parsed.exercises = parsed.exercises.filter(x=>!['bench','incline','fly','shoulder','triceps','pulldown','row','deadlift','curl','squat','legpress'].includes(x.id));
        const known = new Set(parsed.exercises.map(x=>x.id));
        // Osveži metapodatke vežbi koje su već postojale (npr. RDL i listovi), bez diranja korisničkih slika ili unosa.
        parsed.exercises = parsed.exercises.map(existing => {
          const fresh = baseExercises.find(x=>x.id===existing.id);
          if(!fresh) return existing;
          return {...fresh,...existing,sets:fresh.sets??existing.sets,reps:fresh.reps??existing.reps,rest:fresh.rest??existing.rest,how:fresh.how??existing.how,tips:fresh.tips??existing.tips,equipment:fresh.equipment??existing.equipment};
        });
        parsed.exercises.push(...baseExercises.filter(x=>!known.has(x.id)));
        parsed.templates = Array.isArray(parsed.templates) ? parsed.templates : [];
        const knownPlans = new Set(parsed.templates.map(x=>x.id));
        parsed.templates.push(...baseTemplates.filter(x=>!knownPlans.has(x.id)));
        return parsed;
      }
    } catch(e){ console.warn('Neispravan lokalni zapis', e); }
    return freshState();

  function esc(value=''){ return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
  function uid(prefix='id'){ return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`; }
  function localDate(date = new Date()){ return new Intl.DateTimeFormat('sr-Latn-RS',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(date)); }
  function shortDate(date){ return new Intl.DateTimeFormat('sr-Latn-RS',{day:'2-digit',month:'short'}).format(new Date(date)); }
  function time(date){ return new Intl.DateTimeFormat('sr-Latn-RS',{hour:'2-digit',minute:'2-digit'}).format(new Date(date)); }
  function volume(sets=[]){ return Math.round(sets.reduce((sum,s)=>sum + Number(s.weight||0)*Number(s.reps||0),0)); }
  function e1rm(set){ return Number(set.weight||0) * (1 + Number(set.reps||0)/30); }
  function exercise(id){ return state.exercises.find(e=>e.id===id); }
  function activeWorkout(){ return state.workouts.find(w=>!w.completed); }
  function completedWorkouts(){ return state.workouts.filter(w=>w.completed).sort((a,b)=>new Date(b.date)-new Date(a.date)); }
  function setsFor(workout, exerciseId){ return (workout?.sets||[]).filter(s=>s.exerciseId===exerciseId).sort((a,b)=>a.setNumber-b.setNumber); }
  function workoutsForExercise(id){ return completedWorkouts().filter(w=>setsFor(w,id).length); }
  function previousSets(id){ return setsFor(workoutsForExercise(id)[0], id); }
  function bestSet(id){
    const sets = completedWorkouts().flatMap(w=>setsFor(w,id));
    return sets.sort((a,b)=>e1rm(b)-e1rm(a))[0] || null;
  }
  function historicalSets(id){ return completedWorkouts().flatMap(w=>setsFor(w,id)); }
  function prRecords(id){ const sets=historicalSets(id); if(!sets.length)return {weight:null,reps:null,e1rm:null}; return {weight:sets.slice().sort((a,b)=>b.weight-a.weight||b.reps-a.reps)[0],reps:sets.slice().sort((a,b)=>b.reps-a.reps||b.weight-a.weight)[0],e1rm:sets.slice().sort((a,b)=>e1rm(b)-e1rm(a))[0]}; }
  function evaluatePR(id,weight,reps){ const history=historicalSets(id); if(!history.length)return {weight:true,rep:true,e1rm:true,first:true}; const maxWeight=Math.max(...history.map(s=>+s.weight||0)); const same=history.filter(s=>+s.weight===+weight); const maxReps=same.length?Math.max(...same.map(s=>+s.reps||0)):0; const max1=Math.max(...history.map(e1rm)); return {weight:+weight>maxWeight,rep:same.length>0&&+reps>maxReps,e1rm:e1rm({weight:+weight,reps:+reps})>max1+.01,first:false}; }
  function prBadges(pr){ if(!pr)return '';const x=[];if(pr.weight)x.push('<span class="pr-badge weight">🏆 Weight PR</span>');if(pr.rep)x.push('<span class="pr-badge rep">⚡ Rep PR</span>');if(pr.e1rm)x.push('<span class="pr-badge e1rm">📈 1RM PR</span>');return x.length?`<div class="pr-strip">${x.join('')}</div>`:''; }

  function chartSvg(points){
    if(points.length<2) return `<div class="empty" style="padding-bottom:5px">Potrebna su najmanje 2 treninga za graf.</div>`;
    const w=600,h=190,p=28; const vals=points.map(x=>x.value); const min=Math.min(...vals)*.94,max=Math.max(...vals)*1.04 || 1;
    const coords=points.map((pt,i)=>({x:p+i*(w-2*p)/(points.length-1),y:h-p-(pt.value-min)/(max-min||1)*(h-2*p),...pt}));
    const line=coords.map((c,i)=>`${i?'L':'M'} ${c.x.toFixed(1)} ${c.y.toFixed(1)}`).join(' ');
    const area=`${line} L ${coords.at(-1).x} ${h-p} L ${coords[0].x} ${h-p} Z`;
    return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Graf procenjenog jednog ponavljanja"><defs><linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b7f34b" stop-opacity=".28"/><stop offset="1" stop-color="#b7f34b" stop-opacity="0"/></linearGradient></defs>${[0,.5,1].map(q=>`<line class="chart-grid" x1="${p}" y1="${p+q*(h-2*p)}" x2="${w-p}" y2="${p+q*(h-2*p)}"/>`).join('')}<path class="chart-area" d="${area}"/><path class="chart-line" d="${line}"/>${coords.map(c=>`<circle class="chart-dot" cx="${c.x}" cy="${c.y}" r="5"/><text class="chart-label" x="${c.x}" y="${h-7}" text-anchor="middle">${shortDate(c.date).split(' ')[0]}</text>`).join('')}</svg>`;
  }

  function saveSet(exerciseId,setNumber){

  function parseRestSeconds(value='60 s'){ const m=String(value).match(/(\d+)\s*(?:-|–)\s*(\d+)/); if(m)return Math.round((Number(m[1])+Number(m[2]))/2); const n=String(value).match(/\d+/); return n?Number(n[0]):60; }
  function formatClock(seconds){ const n=Math.max(0,Math.ceil(seconds)); return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`; }
  function drawRestTimer(){ const el=document.getElementById('restTimer'); if(!el)return; if(!restTimerEnd&&!restTimerPaused){el.classList.add('hidden');return;} el.classList.remove('hidden'); const seconds=restTimerPaused?restTimerRemaining:Math.max(0,Math.ceil((restTimerEnd-Date.now())/1000)); el.innerHTML=`<div class="rest-dock-top"><div><small style="color:var(--muted)">PAUZA IZMEĐU SERIJA</small><div class="rest-clock" id="restClock">${formatClock(seconds)}</div></div><b>${seconds===0?'Vreme je za sledeću seriju!':'Odmor'}</b></div><div class="rest-actions"><button class="secondary" data-rest-add="15">+15 s</button><button class="secondary" data-rest-toggle="1">${restTimerPaused?'Nastavi':'Pauziraj'}</button><button class="ghost" data-rest-stop="1">Zatvori</button></div>`; }
  function startRestTimer(seconds){ clearInterval(restTimerInterval); restTimerPaused=false; restTimerRemaining=Math.max(1,Number(seconds)||60); restTimerEnd=Date.now()+restTimerRemaining*1000; drawRestTimer(); restTimerInterval=setInterval(()=>{ if(restTimerPaused)return; const left=Math.max(0,Math.ceil((restTimerEnd-Date.now())/1000)); const clock=document.getElementById('restClock'); if(clock)clock.textContent=formatClock(left); if(left<=0){clearInterval(restTimerInterval);restTimerInterval=null; if(navigator.vibrate)navigator.vibrate([250,120,250]); toast('⏱ Pauza je završena – sledeća serija!'); drawRestTimer();} },250); }

  function openModal(html){ modalRoot.innerHTML=`<div class="modal-wrap"><div class="modal">${html}</div></div>`; }
  function closeModal(){ modalRoot.innerHTML=''; }

  function newTemplateModal(){
    openModal(`<div class="modal-head"><h2>Novi plan treninga</h2><button data-close>×</button></div><form id="templateForm" class="form-grid"><label>Naziv<input name="name" required maxlength="40" placeholder="npr. Upper Body"></label><label>Vežbe <span style="font-weight:400">(izaberi redosled)</span><div class="settings-list">${state.exercises.map(e=>`<label class="settings-row"><span>${esc(e.name)}<small>${muscleSr[e.muscle]||e.muscle}</small></span><input type="checkbox" name="exerciseIds" value="${e.id}" style="width:20px"></label>`).join('')}</div></label><div class="modal-actions"><button type="button" class="ghost" data-close>Otkaži</button><button class="primary">Sačuvaj plan</button></div></form>`);
  }

  function addExerciseModal(){
    openModal(`<div class="modal-head"><h2>Dodaj vežbu</h2><button data-close>×</button></div><form id="exerciseForm" class="form-grid"><label>Naziv<input name="name" required maxlength="50" placeholder="Naziv vežbe"></label><label>Mišićna grupa<select name="muscle">${Object.entries(muscleSr).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>Slika sa uređaja (opciono)<input name="image" type="file" accept="image/*"></label><div class="notice">Slika se smanjuje i čuva lokalno. Ne šalje se na internet.</div><div class="modal-actions"><button type="button" class="ghost" data-close>Otkaži</button><button class="primary">Dodaj</button></div></form>`);
  }

  async function fileToSmallDataUrl(file){
    if(!file)return null;
    if(file.size>8*1024*1024) throw new Error('Slika je prevelika (maks. 8 MB)');
    const raw=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=raw});
    const max=900,scale=Math.min(1,max/Math.max(img.width,img.height)); const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    return canvas.toDataURL('image/jpeg',.76);
  }

  function exportData(){
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`reptrack-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup je preuzet');
  }

  document.addEventListener('click', async e=>{
    const nav=e.target.closest('[data-nav]'); if(nav){navigate(nav.dataset.nav);return;}
    const template=e.target.closest('[data-template]'); if(template){selectedTemplate=template.dataset.template;renderTemplatePicker();return;}
    if(e.target.closest('#startSelected')){startWorkout();return;}
    if(e.target.closest('#editSelectedTemplate')){templateExercisePickerModal();return;}
    const addToTemplate=e.target.closest('[data-add-to-template]');if(addToTemplate){addExerciseToTemplate(addToTemplate.dataset.addToTemplate);return;}
    if(e.target.closest('#addWorkoutExercise')){exercisePickerModal();return;}
    const addToWorkout=e.target.closest('[data-add-to-workout]');if(addToWorkout){addExerciseToActive(addToWorkout.dataset.addToWorkout);return;}
    const restBtn=e.target.closest('[data-start-rest]');if(restBtn){const ex=exercise(restBtn.dataset.startRest);startRestTimer(parseRestSeconds(ex?.rest));return;}
    if(e.target.closest('[data-rest-stop]')){stopRestTimer();return;}
    if(e.target.closest('[data-rest-add]')){const add=Number(e.target.closest('[data-rest-add]').dataset.restAdd);if(restTimerPaused)restTimerRemaining+=add;else if(restTimerEnd)restTimerEnd+=add*1000;drawRestTimer();return;}
    if(e.target.closest('[data-rest-toggle]')){if(restTimerPaused){restTimerPaused=false;restTimerEnd=Date.now()+restTimerRemaining*1000;restTimerInterval=setInterval(()=>{if(restTimerPaused)return;const left=Math.max(0,Math.ceil((restTimerEnd-Date.now())/1000));const c=document.getElementById('restClock');if(c)c.textContent=formatClock(left);if(left<=0){clearInterval(restTimerInterval);restTimerInterval=null;toast('⏱ Pauza je završena – sledeća serija!');drawRestTimer();}},250);}else{restTimerRemaining=Math.max(0,Math.ceil((restTimerEnd-Date.now())/1000));restTimerPaused=true;clearInterval(restTimerInterval);restTimerInterval=null;}drawRestTimer();return;}
    const saveBtn=e.target.closest('[data-save-set]'); if(saveBtn){saveSet(saveBtn.dataset.saveSet,Number(saveBtn.dataset.set));return;}
    const add=e.target.closest('[data-add-set]'); if(add){const id=add.dataset.addSet;extraRows[id]=Math.max(extraRows[id]||0,setsFor(activeWorkout(),id).length+2);renderWorkout();return;}
    const copy=e.target.closest('[data-copy-last]'); if(copy){copyLast(copy.dataset.copyLast);return;}
    if(e.target.closest('#finishWorkout')){finishWorkout();return;}
    if(e.target.closest('#cancelWorkout')){if(confirm('Otkaži trening i obriši njegove serije?')){state.workouts=state.workouts.filter(w=>w.completed);save();navigate('home');}return;}
    const px=e.target.closest('[data-progress-ex]'); if(px){selectedProgressExercise=px.dataset.progressEx;renderProgress();window.scrollTo({top:0,behavior:'smooth'});return;}
    const hist=e.target.closest('[data-history]'); if(hist){historyModal(hist.dataset.history);return;}
    if(e.target.closest('#newTemplate')){newTemplateModal();return;}
    if(e.target.closest('#addExercise')){addExerciseModal();return;}
    if(e.target.closest('#exportBtn')){exportData();return;}
    if(e.target.closest('#importBtn')){document.getElementById('importFile').click();return;}
    if(e.target.closest('#resetBtn')){if(confirm('Ovo trajno briše treninge, planove i prilagođene vežbe iz ovog pregledača. Nastaviti?')){state=freshState();save();selectedTemplate='fullbody-a';navigate('home');toast('Podaci su obrisani');}return;}
    if(e.target.closest('[data-close]')||e.target.classList.contains('modal-wrap')) closeModal();
  });

  document.addEventListener('submit', async e=>{
    if(e.target.id==='templateForm'){
      e.preventDefault(); const fd=new FormData(e.target); const ids=fd.getAll('exerciseIds'); if(!ids.length){toast('Izaberi bar jednu vežbu');return;}
      const t={id:uid('template'),name:fd.get('name').trim(),emoji:'🏋️',exerciseIds:ids};state.templates.push(t);selectedTemplate=t.id;save();closeModal();renderTemplatePicker();toast('Plan je sačuvan');
    }
    if(e.target.id==='exerciseForm'){
      e.preventDefault(); const fd=new FormData(e.target); try{const image=await fileToSmallDataUrl(fd.get('image')?.size?fd.get('image'):null);state.exercises.push({id:uid('exercise'),name:fd.get('name').trim(),muscle:fd.get('muscle'),emoji:'🏋️',custom:true,image});save();closeModal();renderMore();toast('Vežba je dodata');}catch(err){toast(err.message||'Slika nije učitana');}
    }
  });

  document.addEventListener('input', e=>{if(e.target.id==='librarySearch')filterLibrary();if(e.target.id==='templateLibrarySearch')filterTemplateLibrary();});
  document.addEventListener('change', e=>{if(e.target.id==='libraryEquipment')filterLibrary();if(e.target.id==='templateLibraryEquipment')filterTemplateLibrary();
    if(e.target.id==='importFile'&&e.target.files[0]){
      const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(data?.version!==1||!Array.isArray(data.exercises)||!Array.isArray(data.workouts))throw new Error();state=data;save();selectedTemplate=state.templates[0]?.id||null;selectedProgressExercise=state.exercises[0]?.id||null;navigate('home');toast('Backup je uspešno uvezen');}catch{toast('Fajl nije validan RepTrack backup');}};reader.readAsText(e.target.files[0]);
    }
  });

  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;document.getElementById('installBtn').hidden=false;});
  document.getElementById('installBtn').addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;document.getElementById('installBtn').hidden=true;});
  if('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));

  render();
})();

  </script>
</body>
</html>
