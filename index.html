<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>RepTrack</title>
<style>
:root{--bg:#0b0d10;--card:#171a20;--card2:#20242c;--text:#f5f7fa;--muted:#9ca6b5;--green:#45d483;--red:#ff6174;--gold:#ffc857;--line:#2a2f39}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.app{max-width:680px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 14px calc(86px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:5;background:rgba(11,13,16,.94);backdrop-filter:blur(12px);padding:14px 2px 12px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:24px}.brand b{color:var(--green)}.small{font-size:12px;color:var(--muted)}h1{font-size:26px;margin:14px 0 5px}h2{font-size:19px;margin:18px 0 10px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}.hero{background:linear-gradient(135deg,#1d4b36,#17221d)}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.grow{flex:1}.btn{border:0;border-radius:13px;padding:12px 14px;background:var(--card2);color:var(--text);font-weight:800;cursor:pointer}.btn.primary{background:var(--green);color:#07140d}.btn.danger{background:#3b1b23;color:#ff9baa}.btn.ghost{border:1px solid var(--line);background:transparent}.btn.sm{padding:8px 10px;font-size:13px}.btn:disabled{opacity:.45}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:11px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#101318;color:var(--text);padding:12px}.exercise-item{display:flex;gap:12px;align-items:center}.thumb{width:76px;height:76px;border-radius:14px;background:#252a32;object-fit:cover;flex:none}.placeholder{display:grid;place-items:center;color:var(--muted);font-size:28px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#26312b;color:#8cf0b5;font-size:12px}.muted{color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:28px 10px}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(680px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#11141a;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}.tab{background:none;border:0;color:var(--muted);padding:8px 2px;font-size:11px}.tab span{display:block;font-size:21px}.tab.active{color:var(--green)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{background:#15181e;width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));border:1px solid var(--line)}.preview{width:100%;max-height:230px;object-fit:contain;border-radius:14px;background:#0c0e12;margin-top:10px}.checklist label{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}.checklist input{width:20px;height:20px}.workout-ex{overflow:hidden}.workout-ex img{width:100%;height:190px;object-fit:cover;border-radius:14px}.setrow{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:8px;align-items:center;margin:8px 0}.setrow input{min-width:0;width:100%;background:#101318;border:1px solid var(--line);color:white;padding:11px 8px;border-radius:10px;text-align:center}.history{font-size:13px;color:var(--muted);padding:8px;background:#101318;border-radius:10px;margin:8px 0}.notice{background:#4b3b13;color:#ffe39b;border-radius:12px;padding:10px;font-size:13px}.drag{cursor:grab;color:var(--muted);font-size:20px}.hidden{display:none!important}@media(min-width:560px){.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cards .card{margin:0}.sheet{border-radius:24px;margin-bottom:18px}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand">Rep<b>Track</b></div><button class="btn sm ghost" onclick="exportData()">Backup</button></header>
  <main id="view"></main>
</div>
<nav class="tabs">
 <button class="tab active" data-view="home"><span>⌂</span>Početna</button>
 <button class="tab" data-view="exercises"><span>🏋</span>Vežbe</button>
 <button class="tab" data-view="plans"><span>▦</span>Treninzi</button>
 <button class="tab" data-view="progress"><span>↗</span>Progres</button>
</nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<input type="file" id="importFile" accept="application/json" class="hidden">
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const DBKEY='reptrack_v3';
const seed={exercises:[],plans:[],sessions:[],active:null};
let db=load(), current='home';
function load(){try{return {...seed,...JSON.parse(localStorage.getItem(DBKEY)||'{}')}}catch(e){return structuredClone(seed)}}
function save(){localStorage.setItem(DBKEY,JSON.stringify(db))}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const exBy=id=>db.exercises.find(x=>x.id===id);
function nav(v){current=v; $$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===v)); render()}
$$('.tab').forEach(b=>b.onclick=()=>nav(b.dataset.view));
function render(){({home:homeView,exercises:exerciseView,plans:plansView,progress:progressView}[current]||homeView)()}
function homeView(){
 const last=[...db.sessions].filter(s=>s.endedAt).sort((a,b)=>b.startedAt-a.startedAt)[0];
 $('#view').innerHTML=`<h1>Zdravo 👋</h1><p class="muted">Prati kilažu, ponavljanja i napredak.</p>
 <div class="card hero"><h2>${db.active?'Trening je u toku':'Spreman za trening?'}</h2><p>${db.active?'Nastavi tamo gde si stao.':'Izaberi jedan od svojih treninga.'}</p><button class="btn primary" onclick="${db.active?'openActive()':'choosePlan()'}">${db.active?'NASTAVI TRENING':'POČNI TRENING'}</button></div>
 <div class="grid2"><div class="card"><b>${db.exercises.length}</b><div class="small">vežbi</div></div><div class="card"><b>${db.sessions.filter(s=>s.endedAt).length}</b><div class="small">treninga</div></div></div>
 <h2>Poslednji trening</h2>${last?`<div class="card"><b>${esc(last.planName)}</b><div class="small">${new Date(last.startedAt).toLocaleDateString('sr-RS')} · ${last.sets.length} serija</div></div>`:`<div class="empty">Još nema završenih treninga.</div>`}
 <div class="row"><button class="btn ghost grow" onclick="$('#importFile').click()">Vrati backup</button><button class="btn ghost grow" onclick="exportData()">Sačuvaj backup</button></div>`}
function exerciseView(){
 $('#view').innerHTML=`<div class="row between"><div><h1>Moje vežbe</h1><div class="small">Dodaj naziv, grupu i svoju sliku</div></div><button class="btn primary" onclick="exerciseModal()">+ Dodaj</button></div>
 <div class="cards">${db.exercises.map(x=>`<div class="card exercise-item">${x.image?`<img class="thumb" src="${x.image}">`:`<div class="thumb placeholder">🏋</div>`}<div class="grow"><b>${esc(x.name)}</b><div><span class="tag">${esc(x.group||'Ostalo')}</span></div></div><button class="btn sm" onclick="exerciseModal('${x.id}')">Uredi</button></div>`).join('')}</div>${db.exercises.length?'':'<div class="empty">Dodaj prvu vežbu i fotografiju.</div>'}`}
function exerciseModal(id){
 const x=id?exBy(id):{id:'',name:'',group:'',image:''};
 openModal(`<div class="row between"><h2>${id?'Izmeni':'Nova'} vežba</h2><button class="btn sm ghost" onclick="closeModal()">✕</button></div>
 <div class="field"><label>Naziv vežbe</label><input id="exName" value="${esc(x.name)}" placeholder="npr. Bench press"></div>
 <div class="field"><label>Mišićna grupa</label><input id="exGroup" value="${esc(x.group)}" placeholder="npr. Grudi"></div>
 <div class="field"><label>Slika sa telefona</label><input id="exImage" type="file" accept="image/*"><input type="hidden" id="oldImage" value="${x.image||''}">${x.image?`<img id="imagePreview" class="preview" src="${x.image}">`:`<img id="imagePreview" class="preview hidden">`}</div>
 <button class="btn primary" style="width:100%" onclick="saveExercise('${id||''}')">Sačuvaj vežbu</button>${id?`<button class="btn danger" style="width:100%;margin-top:10px" onclick="deleteExercise('${id}')">Obriši vežbu</button>`:''}`);
 $('#exImage').onchange=async e=>{if(e.target.files[0]){const d=await compressImage(e.target.files[0]);$('#oldImage').value=d;$('#imagePreview').src=d;$('#imagePreview').classList.remove('hidden')}}
}
function compressImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=900,scale=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.76))};im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function saveExercise(id){const name=$('#exName').value.trim();if(!name)return alert('Upiši naziv vežbe.');const obj={id:id||uid(),name,group:$('#exGroup').value.trim()||'Ostalo',image:$('#oldImage').value};if(id)db.exercises[db.exercises.findIndex(x=>x.id===id)]=obj;else db.exercises.push(obj);save();closeModal();exerciseView()}
function deleteExercise(id){if(!confirm('Obrisati vežbu? Biće uklonjena i iz planova.'))return;db.exercises=db.exercises.filter(x=>x.id!==id);db.plans.forEach(p=>p.exerciseIds=p.exerciseIds.filter(e=>e!==id));save();closeModal();exerciseView()}
function plansView(){
 $('#view').innerHTML=`<div class="row between"><div><h1>Moji treninzi</h1><div class="small">Sam biraš naziv, vežbe i redosled</div></div><button class="btn primary" onclick="planModal()">+ Dodaj</button></div>
 ${db.plans.map(p=>`<div class="card"><div class="row between"><div><b>${esc(p.name)}</b><div class="small">${p.exerciseIds.length} vežbi</div></div><button class="btn sm" onclick="planModal('${p.id}')">Uredi</button></div><div class="small" style="margin-top:9px">${p.exerciseIds.map(id=>exBy(id)?.name).filter(Boolean).map(esc).join(' · ')||'Nema vežbi'}</div><button class="btn primary" style="width:100%;margin-top:12px" onclick="startWorkout('${p.id}')">Pokreni</button></div>`).join('')}${db.plans.length?'':'<div class="empty">Napravi prvi trening i izaberi vežbe.</div>'}`}
function planModal(id){
 const p=id?db.plans.find(x=>x.id===id):{id:'',name:'',exerciseIds:[]};
 openModal(`<div class="row between"><h2>${id?'Izmeni':'Novi'} trening</h2><button class="btn sm ghost" onclick="closeModal()">✕</button></div><div class="field"><label>Naziv treninga</label><input id="planName" value="${esc(p.name)}" placeholder="npr. Grudi i triceps"></div><div class="field"><label>Izaberi vežbe</label><div class="checklist">${db.exercises.map(x=>`<label><input type="checkbox" value="${x.id}" ${p.exerciseIds.includes(x.id)?'checked':''}><span>${esc(x.name)}</span></label>`).join('')||'<div class="notice">Prvo dodaj vežbe u kartici Vežbe.</div>'}</div></div><button class="btn primary" style="width:100%" onclick="savePlan('${id||''}')">Sačuvaj trening</button>${id?`<button class="btn danger" style="width:100%;margin-top:10px" onclick="deletePlan('${id}')">Obriši trening</button>`:''}`)}
function savePlan(id){const name=$('#planName').value.trim(),ids=$$('.checklist input:checked').map(x=>x.value);if(!name)return alert('Upiši naziv treninga.');if(!ids.length)return alert('Izaberi bar jednu vežbu.');const obj={id:id||uid(),name,exerciseIds:ids};if(id)db.plans[db.plans.findIndex(x=>x.id===id)]=obj;else db.plans.push(obj);save();closeModal();plansView()}
function deletePlan(id){if(!confirm('Obrisati ovaj trening?'))return;db.plans=db.plans.filter(x=>x.id!==id);save();closeModal();plansView()}
function choosePlan(){if(!db.plans.length){nav('plans');return}openModal(`<div class="row between"><h2>Izaberi trening</h2><button class="btn sm ghost" onclick="closeModal()">✕</button></div>${db.plans.map(p=>`<button class="btn primary" style="width:100%;margin:6px 0" onclick="startWorkout('${p.id}')">${esc(p.name)}</button>`).join('')}`)}
function startWorkout(pid){if(db.active&&!confirm('Već postoji aktivan trening. Započeti novi?'))return;const p=db.plans.find(x=>x.id===pid);db.active={id:uid(),planId:p.id,planName:p.name,startedAt:Date.now(),sets:[]};save();closeModal();openActive()}
function previousSets(exid){const s=[...db.sessions].filter(s=>s.sets.some(z=>z.exerciseId===exid)).sort((a,b)=>b.startedAt-a.startedAt)[0];return s?s.sets.filter(z=>z.exerciseId===exid):[]}
function openActive(){current='active';const a=db.active;if(!a){nav('home');return}const p=db.plans.find(x=>x.id===a.planId);const ids=p?p.exerciseIds:[...new Set(a.sets.map(x=>x.exerciseId))];$('#view').innerHTML=`<div class="row between"><div><h1>${esc(a.planName)}</h1><div class="small">Trening u toku</div></div><button class="btn danger sm" onclick="finishWorkout()">Završi</button></div>${ids.map((id,idx)=>exerciseDuring(id,idx)).join('')}<button class="btn danger" style="width:100%;margin-top:16px" onclick="cancelWorkout()">Otkaži trening</button>`}
function exerciseDuring(id,idx){const x=exBy(id);if(!x)return'';const prev=previousSets(id),cur=db.active.sets.filter(s=>s.exerciseId===id);return `<section class="card workout-ex">${x.image?`<img src="${x.image}">`:''}<h2>${esc(x.name)}</h2>${prev.length?`<div class="history"><b>Prošli put:</b> ${prev.map(s=>`${s.weight} kg × ${s.reps}`).join(' · ')}</div>`:'<div class="history">Nema prethodnog rezultata.</div>'}<div class="small">SET &nbsp;&nbsp;&nbsp; KG &nbsp;&nbsp;&nbsp; PONAVLJANJA</div><div id="sets-${id}">${cur.map((s,i)=>setRow(id,s,i)).join('')}</div><button class="btn ghost" style="width:100%;margin-top:8px" onclick="addSet('${id}')">+ Dodaj seriju</button></section>`}
function setRow(id,s,i){return `<div class="setrow"><b>${i+1}</b><input inputmode="decimal" value="${s.weight??''}" placeholder="kg" onchange="updateSet('${s.id}','weight',this.value)"><input inputmode="numeric" value="${s.reps??''}" placeholder="reps" onchange="updateSet('${s.id}','reps',this.value)"><button class="btn sm danger" onclick="removeSet('${s.id}')">×</button></div>`}
function addSet(exerciseId){const prev=previousSets(exerciseId),cur=db.active.sets.filter(s=>s.exerciseId===exerciseId);const copy=prev[cur.length]||{};db.active.sets.push({id:uid(),exerciseId,weight:copy.weight??'',reps:copy.reps??''});save();openActive()}
function updateSet(id,key,val){const s=db.active.sets.find(x=>x.id===id);s[key]=val===''?'':Math.max(0,Number(String(val).replace(',','.'))||0);save()}
function removeSet(id){db.active.sets=db.active.sets.filter(x=>x.id!==id);save();openActive()}
function finishWorkout(){const bad=db.active.sets.some(s=>s.weight===''||s.reps==='');if(bad&&!confirm('Neke serije nisu popunjene. Ipak završiti?'))return;db.sessions.push({...db.active,endedAt:Date.now(),sets:db.active.sets.filter(s=>s.weight!==''&&s.reps!=='')});db.active=null;save();nav('home')}
function cancelWorkout(){if(confirm('Otkaži aktivni trening? Uneti setovi će biti obrisani.')){db.active=null;save();nav('home')}}
function progressView(){const stats=db.exercises.map(x=>{const sets=db.sessions.flatMap(s=>s.sets).filter(s=>s.exerciseId===x.id);const best=sets.reduce((m,s)=>Number(s.weight)>Number(m.weight||0)?s:m,{});const oneRM=sets.reduce((m,s)=>Math.max(m,Number(s.weight)*(1+Number(s.reps)/30)),0);return{x,count:sets.length,best,oneRM}}).filter(a=>a.count);$('#view').innerHTML=`<h1>Progres</h1><p class="muted">Najbolji rezultat po vežbi</p>${stats.map(a=>`<div class="card"><div class="row between"><div><b>${esc(a.x.name)}</b><div class="small">${a.count} evidentiranih serija</div></div><div style="text-align:right"><b>${a.best.weight} kg × ${a.best.reps}</b><div class="small">Procena 1RM ${a.oneRM.toFixed(1)} kg</div></div></div></div>`).join('')||'<div class="empty">Završi prvi trening da bi se pojavio progres.</div>'}`}
function openModal(h){$('#sheet').innerHTML=h;$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='RepTrack-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
$('#importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.exercises||!d.plans||!d.sessions)throw 0;if(confirm('Ovo će zameniti trenutne podatke. Nastaviti?')){db={...seed,...d,active:null};save();render()}}catch(_){alert('Backup fajl nije ispravan.')}};r.readAsText(f)};
render();
</script>
</body>
</html>
