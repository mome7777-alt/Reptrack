<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="description" content="Privatni dnevnik treninga bez naloga, reklama i pretplate.">
  <title>RepTrack — Fitness dnevnik</title>
  <style>
:root{
  --bg:#0b0d10;--surface:#13171c;--surface-2:#1a2027;--line:#29313a;
  --text:#f6f7f9;--muted:#929eaa;--lime:#b7f34b;--lime-2:#7fce28;
  --blue:#6cc8ff;--orange:#ff9c55;--red:#ff6b6b;--radius:22px;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer}.app-shell{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:94px}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;position:sticky;top:0;background:rgba(11,13,16,.88);backdrop-filter:blur(16px);z-index:20;border-bottom:1px solid rgba(255,255,255,.04)}.brand{display:flex;align-items:center;gap:11px;border:0;background:none;color:var(--text);text-align:left;padding:0}.brand-mark{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:var(--lime);color:#111;font-weight:900;font-size:21px;transform:rotate(-4deg)}.brand strong,.brand small{display:block}.brand strong{font-size:16px;letter-spacing:.2px}.brand small{color:var(--muted);font-size:11px;margin-top:1px}.screen{padding:24px 18px 16px;animation:fade .22s ease}.eyebrow{color:var(--lime);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.6px}.hero{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:23px}.hero h1{font-size:clamp(30px,8vw,48px);line-height:1.02;margin:8px 0 5px;letter-spacing:-1.7px}.hero p{color:var(--muted);margin:0;line-height:1.45}.avatar{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,#26303a,#15191e);font-size:24px;border:1px solid var(--line)}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}.card+.card{margin-top:13px}.start-card{background:linear-gradient(145deg,#b7f34b,#89dd2f);color:#10130d;border:0;padding:22px;position:relative;overflow:hidden}.start-card:after{content:"";position:absolute;width:170px;height:170px;right:-62px;top:-62px;border:28px solid rgba(0,0,0,.09);border-radius:50%}.start-card h2{font-size:26px;margin:4px 0 8px;letter-spacing:-.7px}.start-card p{margin:0 0 22px;max-width:75%;color:#2c3b17}.primary,.secondary,.ghost,.danger{border:0;border-radius:15px;padding:14px 18px;font-weight:800;transition:.15s ease}.primary{background:var(--lime);color:#111}.start-card .primary{background:#10130d;color:#fff;position:relative;z-index:1}.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.danger{background:rgba(255,107,107,.13);color:#ff8585;border:1px solid rgba(255,107,107,.25)}button:active{transform:scale(.98)}button:disabled{opacity:.45;cursor:not-allowed}.compact{padding:9px 12px;border-radius:12px;font-size:12px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 11px}.section-head h2{font-size:18px;margin:0}.section-head button{border:0;background:none;color:var(--lime);font-size:13px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:15px 12px;background:var(--surface);border:1px solid var(--line);border-radius:18px}.stat b{display:block;font-size:23px;letter-spacing:-.7px}.stat span{display:block;color:var(--muted);font-size:11px;margin-top:5px}.last-workout{display:flex;align-items:center;gap:14px}.workout-icon{width:54px;height:54px;display:grid;place-items:center;border-radius:17px;background:var(--surface-2);font-size:23px}.grow{flex:1;min-width:0}.last-workout b,.last-workout span{display:block}.last-workout span{color:var(--muted);font-size:12px;margin-top:4px}.chevron{color:var(--muted);font-size:22px}.template-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.template{min-height:142px;text-align:left;padding:17px;background:var(--surface);border:1px solid var(--line);border-radius:20px;color:var(--text);position:relative;overflow:hidden}.template .emoji{font-size:27px;display:block;margin-bottom:20px}.template b,.template small{display:block}.template small{color:var(--muted);margin-top:5px}.template.selected{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime) inset}.template.custom{display:grid;place-items:center;text-align:center;border-style:dashed;color:var(--muted)}.exercise-card{overflow:hidden;padding:0}.exercise-cover{height:132px;position:relative;display:flex;align-items:flex-end;padding:15px;background-size:cover;background-position:center}.exercise-cover:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 15%,rgba(7,9,11,.82))}.exercise-cover h3,.exercise-cover .muscle{position:relative;z-index:1}.exercise-cover h3{margin:0;font-size:21px}.exercise-cover .muscle{position:absolute;top:13px;right:13px;background:rgba(9,12,15,.68);padding:6px 9px;border-radius:99px;font-size:10px;color:#dce4eb;backdrop-filter:blur(8px)}.exercise-body{padding:15px}.previous{background:var(--surface-2);border-radius:15px;padding:12px;margin-bottom:13px}.previous-label{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.7px}.set-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.set-chip{padding:7px 9px;background:#252d35;border-radius:9px;font-size:12px}.set-row{display:grid;grid-template-columns:28px 1fr 16px 1fr 42px;gap:7px;align-items:center;margin:9px 0}.set-row .set-no{color:var(--muted);font-size:12px}.set-row input{width:100%;min-width:0;background:#0f1317;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 9px;text-align:center;font-weight:800;outline:none}.set-row input:focus{border-color:var(--lime)}.set-row .times{color:var(--muted);text-align:center}.save-set{border:0;width:40px;height:40px;border-radius:12px;background:var(--lime);color:#111;font-weight:900}.save-set.saved{background:#26331b;color:var(--lime)}.field-labels{display:grid;grid-template-columns:28px 1fr 16px 1fr 42px;gap:7px;color:var(--muted);font-size:10px;text-align:center;text-transform:uppercase;letter-spacing:.6px}.exercise-actions{display:flex;gap:8px;margin-top:12px}.exercise-actions button{flex:1;padding:11px;font-size:12px}.sticky-finish{position:sticky;bottom:84px;background:rgba(11,13,16,.9);backdrop-filter:blur(14px);padding:12px 0 5px;z-index:10}.sticky-finish button{width:100%}.page-title{display:flex;align-items:center;gap:12px;margin-bottom:20px}.page-title h1{margin:0;font-size:30px;letter-spacing:-1px}.back{width:40px;height:40px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:13px}.progress-hero{padding:20px;background:linear-gradient(145deg,#1e2831,#11161b)}.metric-big{font-size:43px;font-weight:900;letter-spacing:-2px;margin:7px 0}.metric-big span{font-size:15px;color:var(--muted);letter-spacing:0}.trend{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:99px;background:rgba(183,243,75,.1);color:var(--lime);font-size:12px;font-weight:700}.chart{width:100%;height:190px;margin-top:15px;overflow:visible}.chart-line{fill:none;stroke:var(--lime);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.chart-area{fill:url(#areaGradient)}.chart-dot{fill:var(--surface);stroke:var(--lime);stroke-width:3}.chart-grid{stroke:#29313a;stroke-width:1}.chart-label{fill:var(--muted);font-size:10px}.exercise-list{display:flex;flex-direction:column;gap:9px}.exercise-list button,.history-row{display:flex;align-items:center;gap:13px;text-align:left;width:100%;padding:12px;border-radius:17px;background:var(--surface);border:1px solid var(--line);color:var(--text)}.thumb{width:52px;height:52px;border-radius:14px;background-size:cover;background-position:center;display:grid;place-items:center;font-size:23px;flex:none}.exercise-list b,.exercise-list small,.history-row b,.history-row small{display:block}.exercise-list small,.history-row small{color:var(--muted);margin-top:4px}.pill{font-size:11px;color:var(--lime);background:rgba(183,243,75,.1);padding:6px 8px;border-radius:99px}.settings-list{display:flex;flex-direction:column;gap:9px}.settings-list button,.settings-row{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:17px;padding:15px}.settings-list button span,.settings-row span{display:block}.settings-list small,.settings-row small{display:block;color:var(--muted);margin-top:4px}.empty{text-align:center;padding:35px 18px;color:var(--muted)}.empty .icon{display:block;font-size:39px;margin-bottom:12px}.form-grid{display:grid;gap:13px}.form-grid label{display:grid;gap:7px;color:var(--muted);font-size:12px;font-weight:700}.form-grid input,.form-grid select,.form-grid textarea{width:100%;background:#0f1317;border:1px solid var(--line);color:var(--text);border-radius:13px;padding:13px;outline:none}.form-grid input:focus,.form-grid select:focus,.form-grid textarea:focus{border-color:var(--lime)}.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}.modal{width:min(100%,620px);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:20px;animation:slide .23s ease}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modal-head h2{margin:0}.modal-head button{border:0;background:var(--surface-2);color:var(--text);width:35px;height:35px;border-radius:11px}.modal-actions{display:flex;gap:9px;margin-top:18px}.modal-actions button{flex:1}.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,18px);background:#eef6e2;color:#17200d;padding:11px 15px;border-radius:13px;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:80;white-space:nowrap;box-shadow:0 12px 35px rgba(0,0,0,.35)}.toast.show{opacity:1;transform:translate(-50%,0)}.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,760px);height:78px;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(17,21,25,.93);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:30}.bottom-nav button{border:0;background:none;color:#7f8b96;font-size:10px;font-weight:700;border-radius:13px}.bottom-nav button span{display:block;font-size:21px;line-height:22px;margin-bottom:4px}.bottom-nav button.active{color:var(--lime);background:rgba(183,243,75,.07)}.notice{font-size:12px;line-height:1.5;color:var(--muted);padding:13px;border:1px solid var(--line);border-radius:14px;background:#101419}.full{width:100%}.mt{margin-top:13px}.hidden{display:none!important}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes slide{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}@media(min-width:600px){.screen{padding-left:28px;padding-right:28px}.template-grid{grid-template-columns:repeat(3,1fr)}.stats{gap:14px}.exercise-card{display:grid;grid-template-columns:220px 1fr}.exercise-cover{height:auto;min-height:270px}.modal-wrap{align-items:center}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-nav="home" aria-label="Početna">
        <span class="brand-mark">R</span>
        <span><strong>RepTrack</strong><small>Lični fitness dnevnik</small></span>
      </button>
      <button id="installBtn" class="ghost compact" hidden>Instaliraj</button>
    </header>

    <main id="app" tabindex="-1" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Glavna navigacija">
      <button data-nav="home" class="active"><span>⌂</span>Početna</button>
      <button data-nav="workout"><span>＋</span>Trening</button>
      <button data-nav="progress"><span>↗</span>Progres</button>
      <button data-nav="more"><span>•••</span>Više</button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <div id="modalRoot"></div>
  <script>
(() => {
  'use strict';

  const STORAGE_KEY = 'reptrack-data-v1';
  const app = document.getElementById('app');
  const toastEl = document.getElementById('toast');
  const modalRoot = document.getElementById('modalRoot');
  const palette = { Chest:'#aa69ff', Back:'#4fb8ff', Shoulders:'#ff9c55', Arms:'#ff6f91', Legs:'#62d28d', Core:'#ffd45c', Other:'#9aa9b8' };
  const muscleSr = { Chest:'Grudi', Back:'Leđa', Shoulders:'Ramena', Arms:'Ruke', Legs:'Noge', Core:'Core', Other:'Ostalo' };

  const baseExercises = [
    ['bench','Bench press','Chest','🏋️'],['incline','Kosi potisak bučicama','Chest','💪'],['fly','Cable fly','Chest','↔️'],
    ['shoulder','Shoulder press','Shoulders','⬆️'],['lateral','Lateral raise','Shoulders','🪽'],['triceps','Triceps pushdown','Arms','🔻'],
    ['pulldown','Lat pulldown','Back','🔽'],['row','Seated row','Back','🚣'],['deadlift','Deadlift','Back','⚡'],
    ['curl','Biceps curl','Arms','💪'],['squat','Čučanj','Legs','🦵'],['legpress','Leg press','Legs','🏔️'],
    ['rdl','Rumunsko mrtvo dizanje','Legs','⚙️'],['calf','Calf raise','Legs','⬆️'],['plank','Plank','Core','▰']
  ].map(([id,name,muscle,emoji]) => ({id,name,muscle,emoji,custom:false}));

  const baseTemplates = [
    {id:'push',name:'Push',emoji:'🔥',exerciseIds:['bench','incline','shoulder','lateral','triceps']},
    {id:'pull',name:'Pull',emoji:'⚡',exerciseIds:['pulldown','row','deadlift','curl']},
    {id:'legs',name:'Legs',emoji:'🦵',exerciseIds:['squat','legpress','rdl','calf']}
  ];

  let state = loadState();
  let route = state.workouts.some(w => !w.completed) ? 'workout' : 'home';
  let selectedTemplate = state.templates[0]?.id || null;
  let selectedProgressExercise = state.exercises[0]?.id || null;
  let extraRows = {};
  let installPrompt = null;

  function freshState(){
    return {version:1,profile:{name:'Ivan'},exercises:baseExercises,templates:baseTemplates,workouts:[]};
  }
  function loadState(){
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if(parsed?.version === 1 && Array.isArray(parsed.exercises) && Array.isArray(parsed.workouts)) return parsed;
    } catch(e){ console.warn('Neispravan lokalni zapis', e); }
    return freshState();
  }
  function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  function esc(value=''){ return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
  function uid(prefix='id'){ return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`; }
  function localDate(date = new Date()){ return new Intl.DateTimeFormat('sr-Latn-RS',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(date)); }
  function shortDate(date){ return new Intl.DateTimeFormat('sr-Latn-RS',{day:'2-digit',month:'short'}).format(new Date(date)); }
  function time(date){ return new Intl.DateTimeFormat('sr-Latn-RS',{hour:'2-digit',minute:'2-digit'}).format(new Date(date)); }
  function volume(sets=[]){ return Math.round(sets.reduce((sum,s)=>sum + Number(s.weight||0)*Number(s.reps||0),0)); }
  function e1rm(set){ return Number(set.weight||0) * (1 + Number(set.reps||0)/30); }
  function exercise(id){ return state.exercises.find(e=>e.id===id); }
  function activeWorkout(){ return state.workouts.find(w=>!w.completed); }
  function completedWorkouts(){ return state.workouts.filter(w=>w.completed).sort((a,b)=>new Date(b.date)-new Date(a.date)); }
  function setsFor(workout, exerciseId){ return (workout?.sets||[]).filter(s=>s.exerciseId===exerciseId).sort((a,b)=>a.setNumber-b.setNumber); }
  function workoutsForExercise(id){ return completedWorkouts().filter(w=>setsFor(w,id).length); }
  function previousSets(id){ return setsFor(workoutsForExercise(id)[0], id); }
  function bestSet(id){
    const sets = completedWorkouts().flatMap(w=>setsFor(w,id));
    return sets.sort((a,b)=>e1rm(b)-e1rm(a))[0] || null;
  }
  function startOfMonth(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),1); }
  function setNav(){
    document.querySelectorAll('.bottom-nav [data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===route));
  }
  function navigate(next){ route=next; setNav(); render(); window.scrollTo({top:0,behavior:'smooth'}); }
  function toast(message){ toastEl.textContent=message; toastEl.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>toastEl.classList.remove('show'),2200); }

  function imageFor(ex){
    if(ex?.image) return ex.image;
    const color = palette[ex?.muscle] || palette.Other;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500"><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop stop-color="${color}"/><stop offset="1" stop-color="#111820"/></linearGradient></defs><rect width="900" height="500" fill="url(#g)"/><circle cx="720" cy="95" r="170" fill="#fff" opacity=".08"/><circle cx="145" cy="450" r="220" fill="#000" opacity=".13"/><g transform="translate(450 245) rotate(-8)" fill="#fff" opacity=".88"><rect x="-185" y="-18" width="370" height="36" rx="18"/><rect x="-230" y="-70" width="48" height="140" rx="15"/><rect x="182" y="-70" width="48" height="140" rx="15"/><rect x="-270" y="-48" width="38" height="96" rx="12"/><rect x="232" y="-48" width="38" height="96" rx="12"/></g><text x="55" y="85" font-size="44" font-family="Arial" fill="#fff" opacity=".94">${ex?.emoji||'🏋️'}</text></svg>`;
    return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
  }
  function cover(ex, className='thumb'){ return `<span class="${className}" style="background-image:url('${imageFor(ex).replace(/'/g,'%27')}')"></span>`; }

  function render(){
    setNav();
    if(route==='home') renderHome();
    else if(route==='workout') renderWorkout();
    else if(route==='progress') renderProgress();
    else renderMore();
  }

  function renderHome(){
    const done = completedWorkouts();
    const monthCount = done.filter(w=>new Date(w.date)>=startOfMonth()).length;
    const totalVol = done.reduce((sum,w)=>sum+volume(w.sets),0);
    const last = done[0];
    const active = activeWorkout();
    app.innerHTML = `<section class="screen">
      <div class="hero"><div><span class="eyebrow">Tvoj trening</span><h1>Zdravo, ${esc(state.profile.name||'')}</h1><p>${new Intl.DateTimeFormat('sr-Latn-RS',{weekday:'long',day:'numeric',month:'long'}).format(new Date())}</p></div><div class="avatar">🏋️</div></div>
      <div class="card start-card"><span class="eyebrow" style="color:#263510">${active?'Trening je u toku':'Spreman za danas?'}</span><h2>${active?esc(active.name):'Napravi sledeći korak.'}</h2><p>${active?'Nastavi tamo gde si stao. Sve sačuvane serije su bezbedne.':'Izaberi plan, pogledaj prošli rezultat i zabeleži svaku seriju.'}</p><button class="primary" data-nav="workout">${active?'Nastavi trening':'Započni trening'} →</button></div>
      <div class="section-head"><h2>Ovaj mesec</h2></div>
      <div class="stats"><div class="stat"><b>${monthCount}</b><span>treninga</span></div><div class="stat"><b>${done.length}</b><span>ukupno</span></div><div class="stat"><b>${totalVol>=1000?(totalVol/1000).toFixed(1)+'t':totalVol+'kg'}</b><span>volumen</span></div></div>
      <div class="section-head"><h2>Poslednji trening</h2>${last?'<button data-nav="progress">Svi rezultati</button>':''}</div>
      ${last?`<button class="card last-workout full" data-history="${last.id}"><span class="workout-icon">${esc(last.emoji||'🏋️')}</span><span class="grow"><b>${esc(last.name)}</b><span>${localDate(last.date)} · ${last.sets.length} serija · ${volume(last.sets)} kg</span></span><span class="chevron">›</span></button>`:`<div class="card empty"><span class="icon">📝</span>Još nema treninga. Prvi unos će ovde napraviti tvoju istoriju.</div>`}
    </section>`;
  }

  function renderWorkout(){
    const active = activeWorkout();
    if(!active){ renderTemplatePicker(); return; }
    const exs = active.exerciseIds.map(exercise).filter(Boolean);
    const savedCount = active.sets.length;
    app.innerHTML = `<section class="screen">
      <div class="page-title"><button class="back" data-nav="home">←</button><div><span class="eyebrow">Trening u toku · ${time(active.date)}</span><h1>${esc(active.name)}</h1></div></div>
      <div class="notice">Serija se čuva čim pritisneš ✓. Možeš zatvoriti pregledač i nastaviti kasnije.</div>
      <div class="section-head"><h2>${exs.length} vežbi</h2><span class="pill">${savedCount} serija sačuvano</span></div>
      ${exs.map(renderExerciseCard).join('')}
      <div class="sticky-finish"><button class="primary" id="finishWorkout" ${savedCount?'':'disabled'}>Završi trening · ${volume(active.sets)} kg</button><button class="ghost full mt" id="cancelWorkout">Otkaži trening</button></div>
    </section>`;
  }

  function renderTemplatePicker(){
    app.innerHTML = `<section class="screen">
      <div class="page-title"><button class="back" data-nav="home">←</button><div><span class="eyebrow">Novi trening</span><h1>Izaberi plan</h1></div></div>
      <div class="template-grid">${state.templates.map(t=>`<button class="template ${selectedTemplate===t.id?'selected':''}" data-template="${t.id}"><span class="emoji">${esc(t.emoji||'🏋️')}</span><b>${esc(t.name)}</b><small>${t.exerciseIds.length} vežbi</small></button>`).join('')}<button class="template custom" id="newTemplate"><span class="emoji">＋</span><b>Novi plan</b><small>Izaberi vežbe</small></button></div>
      <button id="startSelected" class="primary full mt" ${selectedTemplate?'':'disabled'}>Započni izabrani trening</button>
      <div class="notice mt">Nije potrebna prijava. Rezultati se čuvaju samo u ovom pregledaču.</div>
    </section>`;
  }

  function renderExerciseCard(ex){
    const active=activeWorkout();
    const saved=setsFor(active,ex.id);
    const previous=previousSets(ex.id);
    const rows=Math.max(3,saved.length+1,extraRows[ex.id]||0);
    return `<article class="card exercise-card">
      <div class="exercise-cover" style="background-image:url('${imageFor(ex).replace(/'/g,'%27')}')"><span class="muscle">${esc(muscleSr[ex.muscle]||ex.muscle)}</span><h3>${esc(ex.name)}</h3></div>
      <div class="exercise-body"><div class="previous"><div class="previous-label"><span>Prošli put</span><span>${previous.length?shortDate(workoutsForExercise(ex.id)[0].date):'Nema rezultata'}</span></div>${previous.length?`<div class="set-chips">${previous.map(s=>`<span class="set-chip">${s.weight} kg × ${s.reps}</span>`).join('')}</div>`:'<div style="color:var(--muted);font-size:12px;margin-top:8px">Ovo će biti tvoj početni rezultat.</div>'}</div>
      <div class="field-labels"><span>Set</span><span>KG</span><span></span><span>Reps</span><span></span></div>
      ${Array.from({length:rows},(_,i)=>renderSetRow(ex.id,i+1,saved.find(s=>s.setNumber===i+1))).join('')}
      <div class="exercise-actions"><button class="secondary" data-add-set="${ex.id}">＋ Dodaj set</button><button class="ghost" data-copy-last="${ex.id}" ${previous.length?'':'disabled'}>Kopiraj prošli</button></div></div>
    </article>`;
  }

  function renderSetRow(exerciseId,setNumber,saved){
    return `<div class="set-row"><span class="set-no">${setNumber}</span><input id="w_${exerciseId}_${setNumber}" type="number" min="0" max="1000" step="0.5" inputmode="decimal" placeholder="0" value="${saved?.weight??''}" aria-label="Težina, set ${setNumber}"><span class="times">×</span><input id="r_${exerciseId}_${setNumber}" type="number" min="1" max="1000" step="1" inputmode="numeric" placeholder="0" value="${saved?.reps??''}" aria-label="Ponavljanja, set ${setNumber}"><button class="save-set ${saved?'saved':''}" data-save-set="${exerciseId}" data-set="${setNumber}" aria-label="Sačuvaj set">${saved?'✓':'+'}</button></div>`;
  }

  function renderProgress(){
    const done=completedWorkouts();
    const ex=exercise(selectedProgressExercise)||state.exercises[0];
    if(ex) selectedProgressExercise=ex.id;
    const entries=ex?workoutsForExercise(ex.id):[];
    const best=ex?bestSet(ex.id):null;
    const points=entries.slice().reverse().map(w=>({date:w.date,value:Math.max(...setsFor(w,ex.id).map(e1rm)),workout:w}));
    const recent=entries[0]?Math.max(...setsFor(entries[0],ex.id).map(e1rm)):0;
    const prior=entries[1]?Math.max(...setsFor(entries[1],ex.id).map(e1rm)):0;
    const change=prior?((recent-prior)/prior*100):0;
    app.innerHTML=`<section class="screen">
      <div class="hero"><div><span class="eyebrow">Analitika</span><h1>Progres</h1><p>PR, procenjeni 1RM i istorija po vežbi.</p></div><div class="avatar">↗</div></div>
      ${ex?`<div class="card progress-hero"><span class="eyebrow">${esc(ex.name)} · procenjeni 1RM</span><div class="metric-big">${best?Math.round(e1rm(best)):'—'} <span>kg</span></div>${entries.length>1?`<span class="trend">${change>=0?'↑':'↓'} ${Math.abs(change).toFixed(1)}% od prošlog treninga</span>`:'<span class="trend">Počni da beležiš rezultate</span>'}${chartSvg(points)}</div>`:''}
      <div class="section-head"><h2>Vežbe</h2></div><div class="exercise-list">${state.exercises.map(item=>{const b=bestSet(item.id);return `<button data-progress-ex="${item.id}">${cover(item)}<span class="grow"><b>${esc(item.name)}</b><small>${muscleSr[item.muscle]||item.muscle}</small></span><span class="pill">${b?`${b.weight} × ${b.reps}`:'—'}</span></button>`}).join('')}</div>
      <div class="section-head"><h2>Istorija: ${ex?esc(ex.name):''}</h2></div>${entries.length?entries.map(w=>`<button class="history-row" data-history="${w.id}"><span class="workout-icon">${esc(w.emoji||'🏋️')}</span><span class="grow"><b>${shortDate(w.date)}</b><small>${setsFor(w,ex.id).map(s=>`${s.weight}×${s.reps}`).join(' · ')}</small></span><span>${volume(setsFor(w,ex.id))} kg</span></button>`).join(''):`<div class="card empty">Nema zabeleženih serija za ovu vežbu.</div>`}
      ${!done.length?'<div class="notice mt">Posle prvog završenog treninga ovde će se automatski pojaviti graf i lični rekord.</div>':''}
    </section>`;
  }

  function chartSvg(points){
    if(points.length<2) return `<div class="empty" style="padding-bottom:5px">Potrebna su najmanje 2 treninga za graf.</div>`;
    const w=600,h=190,p=28; const vals=points.map(x=>x.value); const min=Math.min(...vals)*.94,max=Math.max(...vals)*1.04 || 1;
    const coords=points.map((pt,i)=>({x:p+i*(w-2*p)/(points.length-1),y:h-p-(pt.value-min)/(max-min||1)*(h-2*p),...pt}));
    const line=coords.map((c,i)=>`${i?'L':'M'} ${c.x.toFixed(1)} ${c.y.toFixed(1)}`).join(' ');
    const area=`${line} L ${coords.at(-1).x} ${h-p} L ${coords[0].x} ${h-p} Z`;
    return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Graf procenjenog jednog ponavljanja"><defs><linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b7f34b" stop-opacity=".28"/><stop offset="1" stop-color="#b7f34b" stop-opacity="0"/></linearGradient></defs>${[0,.5,1].map(q=>`<line class="chart-grid" x1="${p}" y1="${p+q*(h-2*p)}" x2="${w-p}" y2="${p+q*(h-2*p)}"/>`).join('')}<path class="chart-area" d="${area}"/><path class="chart-line" d="${line}"/>${coords.map(c=>`<circle class="chart-dot" cx="${c.x}" cy="${c.y}" r="5"/><text class="chart-label" x="${c.x}" y="${h-7}" text-anchor="middle">${shortDate(c.date).split(' ')[0]}</text>`).join('')}</svg>`;
  }

  function renderMore(){
    const bytes=new Blob([JSON.stringify(state)]).size;
    app.innerHTML=`<section class="screen"><div class="hero"><div><span class="eyebrow">Podešavanja</span><h1>Više</h1><p>Vežbe, backup i privatnost.</p></div><div class="avatar">•••</div></div>
      <div class="section-head"><h2>Tvoja biblioteka</h2><button id="addExercise">＋ Dodaj vežbu</button></div><div class="card"><div class="last-workout"><span class="workout-icon">🏋️</span><span class="grow"><b>${state.exercises.length} vežbi</b><span>${state.templates.length} plana treninga</span></span></div></div>
      <div class="section-head"><h2>Podaci</h2></div><div class="settings-list"><button id="exportBtn"><span><b>Izvezi backup</b><small>Preuzmi sve kao JSON fajl</small></span><span>↓</span></button><button id="importBtn"><span><b>Uvezi backup</b><small>Vrati ili prenesi podatke</small></span><span>↑</span></button><input type="file" id="importFile" accept="application/json" hidden><div class="settings-row"><span><b>Lokalno zauzeće</b><small>U ovom pregledaču</small></span><span>${(bytes/1024).toFixed(1)} KB</span></div><button id="resetBtn"><span><b>Obriši sve podatke</b><small>Vrati aplikaciju na početno stanje</small></span><span style="color:var(--red)">×</span></button></div>
      <div class="section-head"><h2>Privatnost</h2></div><div class="notice">Nema naloga, oglasa, analitike ni servera. Podaci ostaju u lokalnoj memoriji ovog pregledača. Za prenos na drugi telefon koristi backup.</div>
    </section>`;
  }

  function saveSet(exerciseId,setNumber){
    const w=Number(document.getElementById(`w_${exerciseId}_${setNumber}`)?.value);
    const r=Number(document.getElementById(`r_${exerciseId}_${setNumber}`)?.value);
    if(!Number.isFinite(w)||w<0||!Number.isInteger(r)||r<1){ toast('Unesi ispravne KG i ponavljanja'); return; }
    const active=activeWorkout(); if(!active) return;
    const existing=active.sets.find(s=>s.exerciseId===exerciseId&&s.setNumber===setNumber);
    if(existing){ existing.weight=w; existing.reps=r; }
    else active.sets.push({id:uid('set'),exerciseId,setNumber,weight:w,reps:r});
    save(); renderWorkout(); toast('Serija je sačuvana ✓');
  }

  function copyLast(exerciseId){
    const prev=previousSets(exerciseId); if(!prev.length) return;
    prev.forEach(s=>{ const wi=document.getElementById(`w_${exerciseId}_${s.setNumber}`); const ri=document.getElementById(`r_${exerciseId}_${s.setNumber}`); if(wi)wi.value=s.weight;if(ri)ri.value=s.reps; });
    toast('Prethodne serije su kopirane');
  }

  function startWorkout(){
    const t=state.templates.find(x=>x.id===selectedTemplate); if(!t) return;
    state.workouts.push({id:uid('workout'),name:t.name,emoji:t.emoji,date:new Date().toISOString(),endDate:null,exerciseIds:[...t.exerciseIds],sets:[],completed:false});
    save(); route='workout'; render(); toast('Trening je započet');
  }

  function finishWorkout(){
    const w=activeWorkout(); if(!w||!w.sets.length)return;
    w.completed=true; w.endDate=new Date().toISOString(); save(); route='home'; render(); toast(`Trening završen · ${volume(w.sets)} kg`);
  }

  function historyModal(id){
    const w=state.workouts.find(x=>x.id===id); if(!w)return;
    const groups=w.exerciseIds.map(exId=>({ex:exercise(exId),sets:setsFor(w,exId)})).filter(x=>x.ex&&x.sets.length);
    openModal(`<div class="modal-head"><div><span class="eyebrow">${localDate(w.date)}</span><h2>${esc(w.name)}</h2></div><button data-close>×</button></div><div class="stats"><div class="stat"><b>${w.sets.length}</b><span>serija</span></div><div class="stat"><b>${volume(w.sets)}</b><span>kg volumen</span></div><div class="stat"><b>${groups.length}</b><span>vežbi</span></div></div><div class="section-head"><h2>Rezultati</h2></div>${groups.map(g=>`<div class="previous"><div class="previous-label"><span>${esc(g.ex.name)}</span><span>${muscleSr[g.ex.muscle]||g.ex.muscle}</span></div><div class="set-chips">${g.sets.map(s=>`<span class="set-chip">${s.weight} kg × ${s.reps}</span>`).join('')}</div></div>`).join('')}`);
  }

  function openModal(html){ modalRoot.innerHTML=`<div class="modal-wrap"><div class="modal">${html}</div></div>`; }
  function closeModal(){ modalRoot.innerHTML=''; }

  function newTemplateModal(){
    openModal(`<div class="modal-head"><h2>Novi plan treninga</h2><button data-close>×</button></div><form id="templateForm" class="form-grid"><label>Naziv<input name="name" required maxlength="40" placeholder="npr. Upper Body"></label><label>Vežbe <span style="font-weight:400">(izaberi redosled)</span><div class="settings-list">${state.exercises.map(e=>`<label class="settings-row"><span>${esc(e.name)}<small>${muscleSr[e.muscle]||e.muscle}</small></span><input type="checkbox" name="exerciseIds" value="${e.id}" style="width:20px"></label>`).join('')}</div></label><div class="modal-actions"><button type="button" class="ghost" data-close>Otkaži</button><button class="primary">Sačuvaj plan</button></div></form>`);
  }

  function addExerciseModal(){
    openModal(`<div class="modal-head"><h2>Dodaj vežbu</h2><button data-close>×</button></div><form id="exerciseForm" class="form-grid"><label>Naziv<input name="name" required maxlength="50" placeholder="Naziv vežbe"></label><label>Mišićna grupa<select name="muscle">${Object.entries(muscleSr).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>Slika sa uređaja (opciono)<input name="image" type="file" accept="image/*"></label><div class="notice">Slika se smanjuje i čuva lokalno. Ne šalje se na internet.</div><div class="modal-actions"><button type="button" class="ghost" data-close>Otkaži</button><button class="primary">Dodaj</button></div></form>`);
  }

  async function fileToSmallDataUrl(file){
    if(!file)return null;
    if(file.size>8*1024*1024) throw new Error('Slika je prevelika (maks. 8 MB)');
    const raw=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=raw});
    const max=900,scale=Math.min(1,max/Math.max(img.width,img.height)); const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    return canvas.toDataURL('image/jpeg',.76);
  }

  function exportData(){
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`reptrack-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup je preuzet');
  }

  document.addEventListener('click', async e=>{
    const nav=e.target.closest('[data-nav]'); if(nav){navigate(nav.dataset.nav);return;}
    const template=e.target.closest('[data-template]'); if(template){selectedTemplate=template.dataset.template;renderTemplatePicker();return;}
    if(e.target.closest('#startSelected')){startWorkout();return;}
    const saveBtn=e.target.closest('[data-save-set]'); if(saveBtn){saveSet(saveBtn.dataset.saveSet,Number(saveBtn.dataset.set));return;}
    const add=e.target.closest('[data-add-set]'); if(add){const id=add.dataset.addSet;extraRows[id]=Math.max(extraRows[id]||0,setsFor(activeWorkout(),id).length+2);renderWorkout();return;}
    const copy=e.target.closest('[data-copy-last]'); if(copy){copyLast(copy.dataset.copyLast);return;}
    if(e.target.closest('#finishWorkout')){finishWorkout();return;}
    if(e.target.closest('#cancelWorkout')){if(confirm('Otkaži trening i obriši njegove serije?')){state.workouts=state.workouts.filter(w=>w.completed);save();navigate('home');}return;}
    const px=e.target.closest('[data-progress-ex]'); if(px){selectedProgressExercise=px.dataset.progressEx;renderProgress();window.scrollTo({top:0,behavior:'smooth'});return;}
    const hist=e.target.closest('[data-history]'); if(hist){historyModal(hist.dataset.history);return;}
    if(e.target.closest('#newTemplate')){newTemplateModal();return;}
    if(e.target.closest('#addExercise')){addExerciseModal();return;}
    if(e.target.closest('#exportBtn')){exportData();return;}
    if(e.target.closest('#importBtn')){document.getElementById('importFile').click();return;}
    if(e.target.closest('#resetBtn')){if(confirm('Ovo trajno briše treninge, planove i prilagođene vežbe iz ovog pregledača. Nastaviti?')){state=freshState();save();selectedTemplate='push';navigate('home');toast('Podaci su obrisani');}return;}
    if(e.target.closest('[data-close]')||e.target.classList.contains('modal-wrap')) closeModal();
  });

  document.addEventListener('submit', async e=>{
    if(e.target.id==='templateForm'){
      e.preventDefault(); const fd=new FormData(e.target); const ids=fd.getAll('exerciseIds'); if(!ids.length){toast('Izaberi bar jednu vežbu');return;}
      const t={id:uid('template'),name:fd.get('name').trim(),emoji:'🏋️',exerciseIds:ids};state.templates.push(t);selectedTemplate=t.id;save();closeModal();renderTemplatePicker();toast('Plan je sačuvan');
    }
    if(e.target.id==='exerciseForm'){
      e.preventDefault(); const fd=new FormData(e.target); try{const image=await fileToSmallDataUrl(fd.get('image')?.size?fd.get('image'):null);state.exercises.push({id:uid('exercise'),name:fd.get('name').trim(),muscle:fd.get('muscle'),emoji:'🏋️',custom:true,image});save();closeModal();renderMore();toast('Vežba je dodata');}catch(err){toast(err.message||'Slika nije učitana');}
    }
  });

  document.addEventListener('change', e=>{
    if(e.target.id==='importFile'&&e.target.files[0]){
      const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(data?.version!==1||!Array.isArray(data.exercises)||!Array.isArray(data.workouts))throw new Error();state=data;save();selectedTemplate=state.templates[0]?.id||null;selectedProgressExercise=state.exercises[0]?.id||null;navigate('home');toast('Backup je uspešno uvezen');}catch{toast('Fajl nije validan RepTrack backup');}};reader.readAsText(e.target.files[0]);
    }
  });

  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;document.getElementById('installBtn').hidden=false;});
  document.getElementById('installBtn').addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;document.getElementById('installBtn').hidden=true;});
  if('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));

  render();
})();

  </script>
</body>
</html>
